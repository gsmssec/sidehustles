name: Weather Compare Hourly

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  weather-compare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run weather compare bot
        env:
          CITY_1: ${{ secrets.CITY_1 }}
          CITY_2: ${{ secrets.CITY_2 }}
          TIMEZONE: ${{ secrets.TIMEZONE }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          WEATHER_HTTP_RETRIES: ${{ secrets.WEATHER_HTTP_RETRIES }}
          WEATHER_CONNECT_TIMEOUT_SEC: ${{ secrets.WEATHER_CONNECT_TIMEOUT_SEC }}
          WEATHER_READ_TIMEOUT_SEC: ${{ secrets.WEATHER_READ_TIMEOUT_SEC }}
        run: python weather_compare_bot.py
